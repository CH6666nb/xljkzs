spring:
  datasource:
    # 本地 MySQL 连接串
    #   useSSL=false                  本地开发不需要 SSL
    #   serverTimezone=Asia/Shanghai  时区必须写对，否则 datetime 会差 8 小时（原来写的 UTC）
    #   characterEncoding=utf8        防止中文乱码
    #   allowPublicKeyRetrieval=true  MySQL 8 用 caching_sha2_password 时需要，否则可能报 Public Key Retrieval 错
    url: jdbc:mysql://localhost:3306/mental_health_ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

#服务器配置
server:
  port: 1236
